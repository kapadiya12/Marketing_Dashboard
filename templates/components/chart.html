{% load ui %}
<div class="card h-100">
  <div class="card-header"><h3 class="card-title">{{ chart.title }}</h3>{% if chart.has_data and chart.links or chart.has_data and chart.filter %}<span class="chart-hint"><i class="bi bi-hand-index me-1"></i>Click to drill down</span>{% endif %}</div>
  <div class="card-body">
    {% if chart.has_data %}
      <div class="chart-box"><canvas id="canvas-{{ chart.id }}{{ suffix }}" data-chart="chart-data-{{ chart.id }}{{ suffix }}" aria-label="{{ chart.title }}" role="img"></canvas></div>
      <script type="application/json" id="chart-data-{{ chart.id }}{{ suffix }}">{{ chart|to_json }}</script>
    {% else %}
      <div class="chart-empty"><div><i class="bi bi-bar-chart fs-3 d-block mb-1"></i>{{ chart.empty }}</div></div>
    {% endif %}
  </div>
</div>
