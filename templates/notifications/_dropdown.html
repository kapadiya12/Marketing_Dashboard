{% load ui %}
<div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
  <strong class="small">Notifications{% if unread %} ({{ unread }} unread){% endif %}</strong>
  {% if unread %}<form method="post" action="{% url 'notifications:read_all' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.META.HTTP_HX_CURRENT_URL|default:'/' }}"><button class="btn btn-link btn-sm p-0">Mark all read</button></form>{% endif %}
</div>
<div style="max-height:360px;overflow-y:auto">
  {% for n in items %}
    <form method="post" action="{% url 'notifications:read' n.pk %}">{% csrf_token %}
      <button class="list-row w-100 border-0 text-start {% if not n.is_read %}bg-light{% else %}bg-white{% endif %}" type="submit">
        <i class="bi bi-circle-fill text-{{ n.level }}" style="font-size:.5rem"></i>
        <span class="flex-grow-1 min-w-0"><span class="d-block small fw-semibold text-truncate">{{ n.title }}</span>
          <span class="meta d-block text-truncate">{{ n.message }}</span><span class="meta">{{ n.created_at|timesince }} ago</span></span>
      </button>
    </form>
  {% empty %}
    <div class="p-4 text-center text-muted small">No notifications.</div>
  {% endfor %}
</div>
<a class="d-block text-center small py-2 border-top" href="{% url 'notifications:list' %}">View all</a>
