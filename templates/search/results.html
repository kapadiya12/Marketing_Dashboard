{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Search</h1><p class="subtitle">Across every module you can access.</p></div></div>
<form class="card mb-3" method="get"><div class="card-body d-flex gap-2">
  <input class="form-control" type="search" name="q" value="{{ q }}" placeholder="Search records, companies, keywords…" autofocus aria-label="Search">
  <button class="btn btn-primary"><i class="bi bi-search"></i></button></div></form>
{% if groups %}<div class="d-flex justify-content-end mb-2">{% include "components/export_menu.html" with label="Export results" %}</div>{% endif %}
<div class="card">{% include "search/_results.html" with full=True %}</div>
{% endblock %}
